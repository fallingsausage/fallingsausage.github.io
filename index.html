<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falling Sausage</title>
<meta name="description" content="Falling Sausage is a small independent game studio. Our first games are on the way.">
<meta name="theme-color" content="#EDB51C">
<link rel="canonical" href="https://fallingsausage.com/">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Falling Sausage">
<meta property="og:description" content="Falling Sausage is a small independent game studio. Our first games are on the way.">
<meta property="og:url" content="https://fallingsausage.com/">
<meta property="og:image" content="https://fallingsausage.com/share.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/bangers.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Bangers"; src: url("fonts/bangers.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; }
:root { --must:#EDB51C; --must2:#F3C63A; --ink:#1B1410; --cream:#FFF6DC; --red:#D8342B; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; align-items: center;
  background-color: var(--must);
  background-image: radial-gradient(circle, rgba(27,20,16,.075) 1.6px, transparent 1.9px);
  background-size: 16px 16px;
  color: var(--ink);
  font-family: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 1.125rem; line-height: 1.45;
  overflow-x: hidden;
}
main { width: 100%; max-width: 46rem; padding: clamp(1.25rem, 5vw, 2.75rem) clamp(1.1rem, 5vw, 2rem) 1rem; flex: 1; }
h1 { margin: 0; }

/* The logo sits in a comic panel. */
.panel {
  background: #fff; border: 4px solid var(--ink); border-radius: 18px;
  box-shadow: 8px 8px 0 var(--ink);
  padding: clamp(.9rem, 4vw, 1.75rem) clamp(1rem, 5vw, 2.5rem);
  transform: rotate(-1.2deg);
  max-width: 34rem; margin: 0 auto;
}
.panel img { display: block; width: 100%; height: auto; }

/* The CEO's introduction. */
.intro {
  position: relative; z-index: 1;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 12px;
  box-shadow: 5px 5px 0 var(--ink);
  margin: clamp(1.4rem, 5vw, 2.1rem) auto 0; padding: .8rem 1.1rem;
  max-width: 30rem; text-align: center;
  font-weight: 800; font-size: clamp(1.1rem, 4.3vw, 1.4rem); line-height: 1.3;
  transform: rotate(.8deg);
}

/* Spicy Spark and Coming Soon. */
.stage {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(.4rem, 4vw, 2rem);
  margin-top: clamp(1.1rem, 4vw, 1.8rem);
}
.spark {
  position: relative; flex: none; width: clamp(7.25rem, 31vw, 11.5rem);
  background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit;
  -webkit-tap-highlight-color: transparent; border-radius: 16px;
}
.spark:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.spark svg { display: block; width: 100%; height: auto; overflow: visible; }
.tag {
  position: absolute; left: 50%; bottom: -1.05rem; transform: translateX(-50%) rotate(-4deg);
  background: var(--cream); border: 2.5px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink);
  padding: .1rem .55rem .05rem; white-space: nowrap;
  font-family: "Bangers", "Nunito", sans-serif; font-size: clamp(.95rem, 3.6vw, 1.2rem); letter-spacing: .05em; line-height: 1.25;
}
.soon {
  margin: 0; font-family: "Bangers", Impact, "Arial Narrow Bold", sans-serif; font-weight: 400;
  font-size: clamp(3.4rem, 17.5vw, 6.25rem); line-height: .92; letter-spacing: .03em;
  color: #fff; transform: rotate(-3deg);
  text-shadow:
    -3px -3px 0 var(--ink), 0 -3px 0 var(--ink), 3px -3px 0 var(--ink),
    -3px 0 0 var(--ink), 3px 0 0 var(--ink),
    -3px 3px 0 var(--ink), 0 3px 0 var(--ink), 3px 3px 0 var(--ink),
    5px 5px 0 var(--ink), 7px 7px 0 var(--ink), 9px 9px 0 var(--ink);
}
.soon span { display: block; }
.games { text-align: center; margin: clamp(2.1rem, 7vw, 2.75rem) 0 0; font-size: clamp(1.1rem, 4.2vw, 1.35rem); font-weight: 600; }
.games strong { display: block; font-weight: 900; font-size: 1.15em; }

footer {
  width: 100%; padding: 1.5rem 1rem 1.4rem; font-size: .95rem; font-weight: 600;
  display: flex; flex-wrap: wrap; justify-content: center; gap: .15rem .9rem;
}
footer a { color: inherit; text-underline-offset: 3px; }
footer span { white-space: nowrap; }

/* He falls in, then keeps falling. */
@media (prefers-reduced-motion: no-preference) {
  .spark svg { animation: fall-in 1s cubic-bezier(.3,.85,.35,1.12) both; }
  .spark .body { animation: wobble 1.1s ease-in-out .9s infinite alternate; transform-origin: 20px 0; }
  .spark .speed { animation: whoosh .5s linear .9s infinite; }
  .spark .drop { animation: sweat 1.3s ease-out 1s infinite; transform-box: fill-box; transform-origin: center; }
  .spark .d2 { animation-delay: 1.4s; } .spark .d3 { animation-delay: 1.75s; }
  .spark .tag { animation: pop .35s ease-out 1s both; }
}
@keyframes fall-in { from { transform: translateY(-130vh) rotate(-30deg); } to { transform: none; } }
@keyframes wobble { from { transform: rotate(-3.5deg) translateY(-5px); } to { transform: rotate(3.5deg) translateY(5px); } }
@keyframes whoosh { 0% { transform: translateY(18px); opacity: .25; } 40% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }
@keyframes sweat { 0% { opacity: 0; translate: 0 22px; } 25% { opacity: 1; } 100% { opacity: 0; translate: 0 -34px; } }
@keyframes pop { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }

/* Wide screens: logo on the left, everything else on the right. */
@media (min-width: 62rem) {
  main {
    max-width: 72rem; display: grid; grid-template-columns: 1.12fr 1fr; align-items: center;
    column-gap: clamp(2.5rem, 5vw, 4.5rem); padding-top: 2rem; padding-bottom: 0;
  }
  .panel { max-width: none; width: 100%; }
  .intro { margin-top: 0; }
  .soon { font-size: clamp(5rem, 7.6vw, 6.75rem); }
  .spark { width: clamp(10rem, 13vw, 12.5rem); }
}
</style>

<script>
  // Tap Spicy Spark and he falls in again.
  (function () {
    var b = document.querySelector(".spark"); if (!b) return;
    var svg = b.querySelector("svg");
    b.addEventListener("click", function () {
      svg.style.animation = "none"; void svg.getBoundingClientRect(); svg.style.animation = "";
    });
  })();
</script>
